<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Mudassir Siddiqui — AI and ML Engineer</title>
<desc id="desc">Custom vector artwork for Mudassir Siddiqui's GitHub profile.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D1B"/><stop offset=".55" stop-color="#101B35"/><stop offset="1" stop-color="#172B4D"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5EEAD4"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17243D" stop-opacity=".96"/><stop offset="1" stop-color="#0C1427" stop-opacity=".96"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8BA5C8" stroke-opacity=".10" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="320" rx="24" fill="url(#bg)"/>
<rect width="1200" height="320" rx="24" fill="url(#grid)"/>
<path d="M0 250 C210 190 290 300 470 230 S790 160 1200 220" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".45"/>
<circle cx="1000" cy="95" r="110" fill="none" stroke="#38BDF8" stroke-opacity=".18"/>
<circle cx="1000" cy="95" r="78" fill="none" stroke="#A78BFA" stroke-opacity=".28"/>
<circle cx="1000" cy="95" r="46" fill="none" stroke="#5EEAD4" stroke-opacity=".35"/>
<circle cx="1000" cy="95" r="5" fill="#5EEAD4" filter="url(#glow)"/>
<g fill="#A8B9D3" font-family="monospace" font-size="12" letter-spacing="3"><text x="64" y="58">ENGINEERING / AI / PRODUCT BUILDING</text><text x="64" y="278">MUMBAI, INDIA  ·  OPEN TO BUILDING INTERESTING THINGS</text></g>
<text x="60" y="151" fill="#F4F8FF" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="800" letter-spacing="-2">MUDASSIR SIDDIQUI</text>
<rect x="64" y="177" width="58" height="4" rx="2" fill="url(#accent)"/>
<text x="64" y="218" fill="#C9D7EA" font-family="Arial,Helvetica,sans-serif" font-size="22">AI &amp; ML Engineer  <tspan fill="#5EEAD4">/</tspan>  Full-Stack Developer</text>
<g font-family="monospace" font-size="11" fill="#8FA7C7"><text x="875" y="258">BUILD • TEST • ITERATE</text></g>
<style>
@keyframes pulse {0%,100%{opacity:.45}50%{opacity:1}}
@keyframes drift {0%{transform:translateX(0)}50%{transform:translateX(10px)}100%{transform:translateX(0)}}
#orb{animation:pulse 4s ease-in-out infinite}
#trace{animation:drift 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle id="orb" cx="1000" cy="95" r="8" fill="#5EEAD4" filter="url(#glow)"/>
<path id="trace" d="M900 95h-40l-18 18h-42" fill="none" stroke="#5EEAD4" stroke-width="2" opacity=".7"/>

</svg>